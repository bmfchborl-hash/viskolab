<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ViskoLab | Ujian</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07152d;color:#eef5ff;font-family:Poppins,Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:22px}.head,.card{background:linear-gradient(145deg,#0d2d5e,#081a38);border:1px solid #24568f;border-radius:22px;box-shadow:0 14px 40px #0005}.head{padding:24px;margin-bottom:16px}.eyebrow{color:#ffd34f;font-size:12px;font-weight:900;letter-spacing:1.5px}.head h1{margin:7px 0;font-size:30px}.head p{color:#a9c5e7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{padding:18px;margin-bottom:14px}.card h3{margin:0 0 12px;color:#ffd34f}.q{background:#071b3b;border:1px solid #24507f;border-radius:17px;padding:17px;margin:12px 0}.q h4{margin:8px 0 14px;font-size:16px;line-height:1.5}.tag{display:inline-block;padding:5px 9px;border-radius:99px;background:#123d70;color:#9eeaff;font-size:10px;font-weight:900}.opt{display:block;padding:10px 12px;margin:7px 0;border-radius:12px;background:#0c264c;border:1px solid #214a78;cursor:pointer}.opt:hover{border-color:#25d8ff}.opt input{margin-right:8px}.field{width:100%;padding:11px;border-radius:11px;border:1px solid #315d8e;background:#06152d;color:#fff;font:inherit}.btn{border:0;border-radius:12px;padding:12px 18px;background:linear-gradient(135deg,#ffd34f,#e9a72d);color:#101b2d;font-weight:900;cursor:pointer}.btn:disabled{opacity:.5;cursor:not-allowed}.bar{height:9px;background:#102c52;border-radius:99px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#20dfff,#ffd34f)}.result{padding:20px;border-radius:18px;background:#081b38;border:1px solid #d6a83b}.score{font-size:48px;font-weight:900;color:#ffd34f}.good{color:#66f0a5}.bad{color:#ffb0a8}.fb{background:#0b2347;border:1px solid #264f7f;border-radius:13px;padding:13px;margin:8px 0}.fb b{color:#ffd34f}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.loading{padding:18px;text-align:center;color:#9edfff}@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding:12px}.head h1{font-size:24px}}
</style></head><body><main class="wrap"><section class="head"><div class="eyebrow" id="zoneTitle">VISKOLAB • UJIAN</div><h1>Uji Penguasaan Konsep</h1><p>Ujian ini berbeda dari zona lain. Pilihan ganda dinilai otomatis dan jawaban uraian dinilai AI berdasarkan rubrik konsep fisika. Nilai minimal 80.</p><div class="grid"><input id="nama" class="field" placeholder="Nama siswa"><input id="kelas" class="field" placeholder="Kelas"></div><div class="bar"><i id="prog"></i></div></section><div id="exam"></div></main>
<script>
const params=new URLSearchParams(location.search);const zone=Number(params.get('zona')||1);let bank=null,answers={};
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function init(){google.script.run.withSuccessHandler(render).withFailureHandler(e=>showError(e)).getExam(zone)}
function render(data){bank=data;document.getElementById('zoneTitle').textContent=data.title;let html='<section class="card"><h3>Bagian A • Soal objektif</h3>';data.objective.forEach((q,i)=>{html+=`<div class="q"><span class="tag">${esc(q.topic)}</span><h4>${i+1}. ${esc(q.question)}</h4>`;q.options.forEach((o,j)=>{const type=q.type==='multi'?'checkbox':'radio';html+=`<label class="opt"><input type="${type}" name="q${i}" value="${j}" onchange="capture(${i},'${q.type}')">${esc(o)}</label>`});html+='</div>'});html+='</section><section class="card"><h3>Bagian B • Analisis dan uraian</h3><p style="color:#a9c5e7">Jawab dengan alasan fisika yang jelas. Jawaban akan dinilai AI berdasarkan rubrik konsep.</p>';data.essay.forEach((q,i)=>{html+=`<div class="q"><span class="tag">${esc(q.topic)}</span><h4>${i+1}. ${esc(q.question)}</h4><textarea id="e${i}" class="field" rows="5" placeholder="Tuliskan jawaban dan alasanmu..."></textarea></div>`});html+='</section><section class="card"><button id="submit" class="btn" onclick="submit()">✓ KIRIM & NILAI UJIAN</button><div id="msg"></div></section>';document.getElementById('exam').innerHTML=html;updateProgress()}
function capture(i,type){if(type==='multi')answers['q'+i]=[...document.querySelectorAll(`input[name=q${i}]:checked`)].map(x=>x.value);else answers['q'+i]=document.querySelector(`input[name=q${i}]:checked`)?.value;updateProgress()}
function updateProgress(){if(!bank)return;let n=Object.keys(answers).filter(k=>k.startsWith('q')).length;for(let i=0;i<bank.essay.length;i++)if(document.getElementById('e'+i)?.value.trim())n++;const total=bank.objective.length+bank.essay.length;document.getElementById('prog').style.width=(n/total*100)+'%'}
function submit(){const nama=document.getElementById('nama').value.trim(),kelas=document.getElementById('kelas').value.trim();if(!nama||!kelas){alert('Nama dan kelas wajib diisi.');return}for(let i=0;i<bank.objective.length;i++)if(answers['q'+i]===undefined||(Array.isArray(answers['q'+i])&&!answers['q'+i].length)){alert('Jawab semua soal objektif.');return}for(let i=0;i<bank.essay.length;i++)if(!document.getElementById('e'+i).value.trim()){alert('Lengkapi semua jawaban uraian.');return}for(let i=0;i<bank.essay.length;i++)answers['e'+i]=document.getElementById('e'+i).value.trim();document.getElementById('submit').disabled=true;document.getElementById('msg').innerHTML='<div class="loading">⏳ Sedang menghitung nilai dan meminta AI menilai jawaban uraian...</div>';google.script.run.withSuccessHandler(showResult).withFailureHandler(showError).submitExam({zone,nama,kelas,answers})}
function showResult(r){document.getElementById('exam').innerHTML=`<section class="result"><div class="eyebrow">${r.passed?'UJIAN LULUS':'PERLU PERBAIKAN'}</div><div class="score">${r.score}/100</div><p class="${r.passed?'good':'bad'}"><b>${esc(r.feedback)}</b></p><div class="grid"><div class="fb"><b>✓ Yang sudah dikuasai</b><ul>${(r.mastered||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>Belum teridentifikasi</li>'}</ul></div><div class="fb"><b>⚠ Yang masih kurang</b><ul>${(r.weaknesses||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>Tidak ada</li>'}</ul></div></div><div class="fb"><b>📚 Kisi-kisi perbaikan</b><ul>${(r.reviewTopics||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>Pertahankan pemahamanmu.</li>'}</ul></div><div class="fb"><b>🤖 Feedback AI untuk esai</b>${(r.essayFeedback||[]).map(x=>`<p><b>${esc(x.topic)} — ${x.score}/${x.max}</b><br>${esc(x.feedback)}</p>`).join('')}</div><div class="actions"><button class="btn" onclick="window.parent.postMessage({type:'viskolab-exam-result',score:${r.score},passed:${r.passed},mastered:${JSON.stringify(r.mastered||[])},weaknesses:${JSON.stringify(r.weaknesses||[])},reviewTopics:${JSON.stringify(r.reviewTopics||[])},feedback:${JSON.stringify(r.feedback||'')},zone:${r.zone}},'*')">KEMBALI KE VISKOLAB</button>${r.passed?'':'<button class="btn" onclick="location.href=location.pathname+\'?zona='+zone+'&embed=1&retry='+Date.now()">🔁 COBA LAGI</button>'}</div></section>`;window.parent.postMessage({type:'viskolab-exam-result',score:r.score,passed:r.passed,mastered:r.mastered||[],weaknesses:r.weaknesses||[],reviewTopics:r.reviewTopics||[],feedback:r.feedback||'',zone:r.zone},'*')}
function showError(e){document.getElementById('exam').innerHTML='<section class="card"><h3>⚠ Ujian tidak dapat diproses</h3><p>'+esc(e?.message||e||'Terjadi kesalahan.')+'</p><p>Pastikan GEMINI_API_KEY sudah diatur pada Script Properties Apps Script.</p></section>'}
init();
</script></body></html>
